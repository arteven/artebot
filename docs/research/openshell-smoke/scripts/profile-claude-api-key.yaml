id: nanoclaw-claude-api-key
display_name: NanoClaw Claude (API key)
description: Smoke-test profile; API key as x-api-key to api.anthropic.com
category: agent
credentials:
  - name: api_key
    description: Anthropic API key
    env_vars: [ANTHROPIC_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: full
    enforcement: enforce
binaries:
  - /pnpm/global/*/.pnpm/*/node_modules/@anthropic-ai/claude-code/bin/claude.exe
  - /usr/local/bin/node
  - /usr/local/bin/bun
